version: 2

models:
  - name: fct_market_hourly
    description: >
      Hourly DE-LU electricity market facts: day-ahead price, load, residual load and generation
      by source. Grain is one row per UTC hour. Incremental with a 3 day reprocessing window.
    columns:
      - name: ts_utc
        data_tests: [unique, not_null]
      - name: price_eur_mwh
        description: Day-ahead auction price in EUR/MWh.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -600, max_value: 4000}
      - name: load_mwh
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 10000, max_value: 120000, severity: warn}
      - name: renewable_share
        description: Renewable generation divided by total generation (0 to 1).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
  - name: fct_weather_hourly
    description: Hourly weather per region (grain location x UTC hour).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [location, ts_utc]
    columns:
      - name: location
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location
  - name: dim_datetime
    columns:
      - name: ts_utc
        data_tests: [unique, not_null]
      - name: hour_local
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 23}
  - name: dim_location
    columns:
      - name: location_key
        data_tests: [unique, not_null]
