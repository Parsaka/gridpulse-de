x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: gridpulse-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://gridpulse:gridpulse_local_only@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # local-development-only key; real deployments read secrets from Key Vault
    AIRFLOW__CORE__FERNET_KEY: "Z3JpZHB1bHNlLWxvY2FsLWRldi1vbmx5LWtleS0xMjM="
    GRIDPULSE_DATA_DIR: /data
    GRIDPULSE_WAREHOUSE_URL: postgresql+psycopg://gridpulse:gridpulse_local_only@postgres:5432/gridpulse
    GRIDPULSE_MODEL_DIR: /models
    GRIDPULSE_MLFLOW_TRACKING_URI: sqlite:////mlflow/mlflow.db
    DBT_PROFILES_DIR: /opt/airflow/dbt
    DBT_PG_HOST: postgres
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./data:/data
    - ./artifacts:/models
    - ./mlflow:/mlflow
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: gridpulse_local_only
      POSTGRES_DB: gridpulse
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname a --lastname b
        --role Admin --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    profiles: ["airflow"]
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    command: webserver
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    depends_on:
      postgres: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
    command: scheduler

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    profiles: ["monitoring", "api"]
    environment:
      GRIDPULSE_WAREHOUSE_URL: postgresql+psycopg://gridpulse:gridpulse_local_only@postgres:5432/gridpulse
      GRIDPULSE_API_KEYS: ${GRIDPULSE_API_KEYS:-dev-local-key}
      GRIDPULSE_RATE_LIMIT_PER_MIN: ${GRIDPULSE_RATE_LIMIT_PER_MIN:-60}
    volumes: ["./artifacts:/models:ro"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin  # local only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  ingest:
    build: .
    command: ["daily"]
    env_file: [.env]
    environment:
      GRIDPULSE_DATA_DIR: /data
    volumes: ["./data:/data"]
    profiles: ["jobs"]

volumes:
  pgdata:
