services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gridpulse
      POSTGRES_PASSWORD: gridpulse_local_only
      POSTGRES_DB: gridpulse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse"]
      interval: 5s
      retries: 10

  ingest:
    build: .
    command: ["daily"]
    env_file: [.env]
    environment:
      GRIDPULSE_DATA_DIR: /data
    volumes: ["./data:/data"]
    profiles: ["jobs"]

volumes:
  pgdata:
