version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    ignore:
      # pinned to the minor version that was tested; widening it let pip pick a dbt beta
      - dependency-name: "dbt-core"
      - dependency-name: "dbt-postgres"
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    ignore:
      # only used by infra.yml, which cannot run without an Azure subscription (unverifiable)
      - dependency-name: "azure/login"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/docker/api"
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: "/docker/airflow"
    schedule: {interval: weekly}
    ignore:
      # The dags CI job installs Airflow 2.10.5 with its constraints file and never builds this image,
      # so any base-image bump is untested; change image and CI constraints together, by hand.
      - dependency-name: "apache/airflow"
  - package-ecosystem: terraform
    directory: "/infra"
    schedule: {interval: weekly}
    ignore:
      # never applied, so a major provider bump cannot be verified
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
