name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not live" --cov=gridpulse --cov-report=term-missing

  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Airflow (pinned with official constraints) and project
        run: |
          pip install "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install -e ".[dev]"
      - run: airflow db migrate
      - run: pytest tests/test_dags.py -v
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gridpulse
          POSTGRES_PASSWORD: gridpulse_local_only
          POSTGRES_DB: gridpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridpulse" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      GRIDPULSE_DATA_DIR: ./data
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[warehouse,dbt]"
      - name: Synthetic bronze data, load into Postgres
        run: |
          gridpulse sample-data --start 2026-01-01 --days 10
          gridpulse load-warehouse
      - name: dbt build (models + tests)
        working-directory: dbt
        run: |
          dbt deps
          dbt build
