name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start Azurite (Azure Storage emulator)
        run: |
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.33.0             azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ml,api,azure]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not live" --cov=gridpulse --cov-report=term-missing
        env:
          # well-known public Azurite development credentials (emulator only, not a secret)
          GRIDPULSE_TEST_AZURITE_CONN: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history, allowlist in .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect             --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  minimal-install:
    # what a stranger gets from the README quick start: only the base install plus dev tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: gridpulse --help
      - run: pytest -m "not live"

  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Airflow (pinned with official constraints) and project
        run: |
          pip install "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install -e ".[dev]"
      - run: airflow db migrate
      - run: pytest tests/test_dags.py -v
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gridpulse
          POSTGRES_PASSWORD: gridpulse_local_only
          POSTGRES_DB: gridpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridpulse" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      GRIDPULSE_DATA_DIR: ./data
      DBT_PROFILES_DIR: .  # relative to the dbt/ working directory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[warehouse,dbt]"
      - name: Synthetic bronze data, load into Postgres
        run: |
          gridpulse sample-data --start 2026-01-01 --days 10
          gridpulse load-warehouse
      - name: dbt build (models + tests)
        working-directory: dbt
        run: |
          dbt deps
          dbt build
      - name: Shadow-forecast log tests (need gold tables in Postgres)
        run: |
          pip install -e ".[dev,api,ml]"
          pytest tests/test_shadow_pg.py -v
        env:
          GRIDPULSE_TEST_WAREHOUSE_URL: postgresql+psycopg://gridpulse:gridpulse_local_only@localhost:5432/gridpulse

  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/api/Dockerfile -t gridpulse-api:ci .
