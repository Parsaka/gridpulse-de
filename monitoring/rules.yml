groups:
  - name: gridpulse
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "GridPulse API is not reachable by Prometheus"

      - alert: WarehouseUnreachable
        expr: gridpulse_db_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "API cannot reach PostgreSQL; /ready returns 503"

      - alert: DataStale
        expr: gridpulse_data_freshness_hours > 36
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Newest market row is older than 36h (ingestion or dbt not running?)"

      - alert: HighErrorRate
        expr: |
          sum(rate(gridpulse_api_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(gridpulse_api_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of API requests fail with 5xx"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(gridpulse_api_request_seconds_bucket{path!="/metrics"}[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "API p95 latency above 2s"

      - alert: ModelStale
        expr: gridpulse_model_age_hours > 24 * 30
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Model older than 30 days; retrain"
