[project]
name = "gridpulse"
version = "0.1.0"
description = "Data and forecasting platform for the German electricity market (SMARD, ENTSO-E, DWD)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
entsoe = ["entsoe-py>=0.6"]
warehouse = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
ml = ["lightgbm>=4.3", "scikit-learn>=1.5", "mlflow>=2.16,<4", "holidays>=0.50"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "prometheus-client>=0.20", "lightgbm>=4.3", "holidays>=0.50", "sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
viz = ["matplotlib>=3.8", "plotly>=5.20"]
dbt = ["dbt-core>=1.10,<1.11", "dbt-postgres>=1.10,<1.11"]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.17"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[project.scripts]
gridpulse = "gridpulse.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/gen_tmdl.py" = ["E501"]  # long DAX strings read better on one line
"scripts/gen_pbir.py" = ["E501"]  # report copy text
"src/gridpulse/analysis/figures.py" = ["E501"]  # plotting code: long label and style lines
"src/gridpulse/analysis/report.py" = ["E501"]  # prose template
"src/gridpulse/analysis/dashboard.py" = ["E501"]  # Plotly layout dicts and copy text

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: hits real external APIs (deselected in CI)"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
